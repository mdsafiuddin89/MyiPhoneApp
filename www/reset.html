<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IT Credentials — Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-bg">
    <div style="position:absolute;top:1rem;right:1rem;z-index:10;">
      <button id="theme-toggle" class="btn btn-ghost" title="Toggle theme" style="padding:0.5rem;">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
    </div>
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <img src="logo.png" alt="Logo">
        </div>
        <div class="auth-logo-text">
          IT Credentials
          <small>Secure Vault</small>
        </div>
      </div>

      <div class="auth-heading">Reset password</div>
      <div class="auth-sub">Enter your email and we'll send you a reset link</div>

      <div class="form-group">
        <label class="form-label">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@company.com" required autocomplete="email" />
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.65rem;font-size:0.9rem;" onclick="resetPassword()">
        Send Reset Link
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </button>

      <div class="divider"></div>

      <a class="auth-link" href="index.html">
        <span>← Back to Sign In</span>
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
</body>
</html>
