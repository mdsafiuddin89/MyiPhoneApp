<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IT Credentials — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=1.1" />

  <style>
    /* DataTables extra overrides for dark theme */
    table.dataTable tbody tr { background: var(--bg-panel) !important; }
    table.dataTable tbody tr:hover td { background: rgba(79,142,247,0.04) !important; }
    .dataTables_wrapper .dataTables_filter { display: none; } /* we use our own search */
    .dataTables_wrapper { padding: 0.5rem 0 0; }
    .dataTables_length select { background: var(--bg-input) !important; color: var(--text-1) !important; border-color: var(--border) !important; }
    </style>
</head>
<body>
  <div class="wrapper">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <img src="logo.png" alt="Logo">
        </div>
        <div class="sidebar-brand-name">
          IT Credentials
          <span>Secure Vault</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Navigation</div>

        <a href="dashboard.html" class="active">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          Dashboard
        </a>

        <a href="add.html">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path stroke-linecap="round" d="M12 8v8m-4-4h8"/>
          </svg>
          Add Credential
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-btn" id="logout-link" onclick="firebase.auth().signOut().then(()=>window.location.href='index.html')" style="color:var(--red);display:flex;align-items:center;gap:0.6rem;width:100%;background:none;border:none;cursor:pointer;padding:0.55rem 0.75rem;border-radius:6px;font-size:0.83rem;font-weight:500;font-family:var(--font-body);">
          <svg style="width:16px;height:16px;opacity:0.8;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <button class="menu-toggle" aria-label="Toggle menu">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <div class="topbar-title">Credentials Dashboard</div>
        </div>
        <div class="topbar-right">
          <button id="theme-toggle" class="btn btn-ghost" title="Toggle theme">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </button>
          <div class="avatar" id="userAvatar">S
            <div class="dropdown" id="userDropdown">
              <a href="#" id="logout-btn">Sign out</a>
            </div>
          </div>
        </div>
      </div>

      <div class="content">
        <!-- Stats -->
        <div class="stats-row" id="statsRow">
          <div class="stat-card">
            <div class="stat-icon blue">🔑</div>
            <div>
              <div class="stat-value" id="statTotal">—</div>
              <div class="stat-label">Total Credentials</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">🖥️</div>
            <div>
              <div class="stat-value" id="statPlatforms">—</div>
              <div class="stat-label">Platforms</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon amber">📧</div>
            <div>
              <div class="stat-value" id="statEmails">—</div>
              <div class="stat-label">Unique Emails</div>
            </div>
          </div>
        </div>

        <!-- Table Card -->
        <div class="card">
          <div class="controls">
            <div class="search-wrap">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
              </svg>
              <input type="text" id="searchInput" placeholder="Search credentials…" />
            </div>

            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-left:auto;">
              <button class="btn btn-success" onclick="window.location.href='add.html'">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 5v14m-7-7h14"/></svg>
                Add
              </button>

              <label class="btn btn-warning" style="cursor:pointer;">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Import Excel
                <input type="file" id="excelFile" onchange="importFromExcel()" hidden accept=".xlsx,.xls" />
              </label>

              <button class="btn btn-primary" onclick="exportToExcel()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Export
              </button>

              <button class="btn btn-danger" onclick="deleteSelected()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                Delete Selected
              </button>
            </div>
          </div>

          <div class="table-container">
            <table id="employeeTable" class="display dataTable">
              <thead>
                <tr>
                  <th><input type="checkbox" id="selectAll" /></th>
                  <th>Name</th>
                  <th>Platform</th>
                  <th>Website</th>
                  <th>Username</th>
                  <th>Password</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="employeeData">
                <tr>
                  <td colspan="9" style="text-align:center;color:var(--text-3);padding:2rem;font-family:var(--font-mono);font-size:0.78rem;">
                    Loading credentials…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
</body>
</html>
